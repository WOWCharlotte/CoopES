[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coopes"
version = "0.1.0"
description = "Cooperative example selection for in-context learning"
readme = "docs/reproduction-plan.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
data = ["datasets>=2.19"]
ollama = ["httpx>=0.27"]
transformers = ["torch>=2.2", "transformers>=4.41"]
shap = ["shap>=0.45"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
coopes = "coopes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
